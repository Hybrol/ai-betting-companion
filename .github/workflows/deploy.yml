name: CI/CD Deploy to Raspberry Pi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Latest Changes
        run: |
          cd /home/pi/ai-betting-companion
          git fetch origin main
          git reset --hard origin/main

      - name: Update Backend Dependencies
        run: |
          /home/pi/ai-betting-companion/backend/venv/bin/pip install -r /home/pi/ai-betting-companion/backend/requirements.txt

      - name: Build Frontend
        run: |
          cd /home/pi/ai-betting-companion/frontend
          npm install --production=false
          NODE_OPTIONS="--max-old-space-size=1536" npm run build

      - name: Restart 24/7 System Services
        run: |
          sudo systemctl restart ai-betting-backend
          sudo systemctl restart ai-betting-frontend

      - name: Verify Health Check
        run: |
          echo "Waiting for services to finish starting..."
          for i in $(seq 1 15); do
            if curl -sSf http://localhost:8080/ > /dev/null 2>&1 && curl -sSf http://localhost:3001/ > /dev/null 2>&1; then
              echo "Services verified healthy after ${i} attempts!"
              exit 0
            fi
            echo "Waiting for services to come online ($i/15)..."
            sleep 4
          done
          echo "Health check failed to respond in time:"
          curl -v http://localhost:8080/ || true
          curl -v http://localhost:3001/ || true
          exit 1
